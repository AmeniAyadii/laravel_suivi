# Configuration pour Platform.sh/Upsun
applications:
  meditrack-laravel:
    type: php:8.4
    build:
      flavor: composer
    web:
      locations:
        "/":
          root: "public"
          passthru: "/index.php"
    hooks:
      build: |
        composer install --no-dev --optimize-autoloader
      deploy: |
        php artisan migrate --force
    relationships:
      database: "db:mysql"

services:
  db:
    type: mysql:8.0

routes:
  "https://{default}/":
    type: upstream
    upstream: "meditrack-laravel:http"
  "http://{default}/":
    type: redirect
    to: "https://{default}/"