applications:
  app:
    type: php:8.4
    runtime:
      extensions:
        - sodium
        - pdo_mysql
        - mbstring
        - xml
        - zip
        - curl
        - gd
        - bcmath
    build:
      flavor: composer
    web:
      locations:
        "/":
          root: "public"
          passthru: "/index.php"
    hooks:
      build: |
        composer install --no-dev --optimize-autoloader
      deploy: |
        php artisan migrate --force
    variables:
      env:
        APP_NAME: "Laravel"
        APP_ENV: "production"
        APP_DEBUG: "false"
        APP_KEY: "base64:xMovDE+y5MQC53xmC0DfsQWLTaF+qxWR7W1dwU0rZH8="
        APP_URL: "https://{default}"
        DB_CONNECTION: "mysql"
        DB_HOST: "database.internal"
        DB_PORT: "3306"
        DB_DATABASE: "laravel"
        DB_USERNAME: "laravel"
        DB_PASSWORD: "password"
        SESSION_DRIVER: "database"
        CACHE_STORE: "database"
        QUEUE_CONNECTION: "database"
        FILESYSTEM_DISK: "local"
        OPENFDA_BASE_URL: "https://api.fda.gov/drug/ndc.json"
        OPENFDA_TIMEOUT: "30"
        OPENPRODUCTS_BASE_URL: "https://world.openproductsfacts.org/api/v0"
        OPENPRODUCTS_TIMEOUT: "15"
        UNIVERSAL_SCAN_URL: "https://world.openfoodfacts.org/api/v3/product"
        UNIVERSAL_SCAN_TIMEOUT: "20"
        CACHE_DRIVER: "file"
        CACHE_TTL: "86400"
        TWILIO_SID: "AC7a6af8b718368745ff4aeff74ce79e1e"
        TWILIO_TOKEN: "5d1ed75254a6e5949db7fefe4dcaf85a"
        TWILIO_PHONE_NUMBER: "+15005550006"
        TWILIO_TEST_MODE: "true"
        JWT_SECRET: "8f4e2d1a9c6b7e3f8a4c2d9e5f1b7d3a9c6e4f8b2d7a1c9e5f3b8d6a2c4e7f9b1d3a5c8e2f6b9d4a7c3e8f5b2d9a6c4e7f1b8d5a3c9e6f2b7d4a8c5e1f9b3d6a7c2e8f4b9d5a1c7e3f8b6d2a9c4e7f5b1d8a6c3e9f7b4d2a5c8e1f6b3d9a7c4e2f8b5d1a6c3e9f4b7d2a8c5e3f9b6d4a1c7e5f2b8d6a4c9e"
        JWT_TTL: "43200"
        JWT_REFRESH_TTL: "20160"

services:
  database:
    type: "mysql:8.0"
    configuration:
      properties:
        character_set: "utf8mb4"
        collation: "utf8mb4_unicode_ci"
    

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
  "http://{default}/":
    type: redirect
    to: "https://{default}/"