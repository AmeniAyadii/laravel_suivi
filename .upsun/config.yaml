applications:
  app:
    type: php:8.4
    runtime:
      extensions:
        - sodium
        - pdo_mysql
        - mbstring
        - xml
        - zip
        - curl
        - gd
        - bcmath
    build:
      flavor: composer
    web:
      locations:
        "/":
          root: "public"
          passthru: "/index.php"
    mounts:
      "storage":
        source: "local"
        source_path: "storage"
      "bootstrap/cache":
        source: "local"
        source_path: "bootstrap-cache"
    hooks:
      build: |
        composer install --no-dev --optimize-autoloader
      deploy: |
        php artisan migrate --force
    variables:
      env:
        APP_NAME: "Laravel"
        APP_ENV: "production"
        APP_DEBUG: "false"
        APP_KEY: "base64:xMovDE+y5MQC53xmC0DfsQWLTaF+qxWR7W1dwU0rZH8="
        APP_URL: "https://main-bvxea6i-czg6mfkpyeuwe.fr-3.platformsh.site"
        DB_CONNECTION: "mysql"
        DB_HOST: "database.internal"
        DB_PORT: "3306"
        DB_DATABASE: "laravel"
        DB_USERNAME: "laravel"
        DB_PASSWORD: "password"
        SESSION_DRIVER: "database"
        CACHE_STORE: "database"
        QUEUE_CONNECTION: "database"
        FILESYSTEM_DISK: "local"
        CACHE_DRIVER: "file"

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
  "http://{default}/":
    type: redirect
    to: "https://{default}/"