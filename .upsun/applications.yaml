applications:
  meditrack-laravel:
    type: php:8.4
    build:
      flavor: composer
    web:
      locations:
        "/":
          root: "public"
          passthru: "/index.php"
    hooks:
      build: |
        composer install --no-dev
      deploy: |
        php artisan migrate --force
    relationships:
      database: "db:mysql"