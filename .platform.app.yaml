# .platform.app.yaml

# Nom de l'application
name: 'meditrack-laravel'

# Type et version de PHP
type: 'php:8.4'

# Taille du conteneur (gratuit)
size: 'S'

# Build
build:
  flavor: 'composer'

# Runtime
runtime:
  extensions:
    - pdo_pgsql
    - pdo_mysql
    - mbstring
    - xml
    - zip
    - curl
    - gd
    - exif
    - pcntl
    - bcmath

# Relations (base de données)
relationships:
  database: 'db:postgresql'
  database: "database:mysql"

# Variables d'environnement
variables:
  env:
    APP_ENV: 'production'
    APP_DEBUG: 'false'
    APP_URL: 'https://meditrack-laravel.platformsh.site'

# Web configuration
web:
  locations:
    '/':
      root: 'public'
      passthru: '/index.php'
      expires: 1h
      allow: true

# Hooks (scripts d'installation)
hooks:
  build: |
    composer install --no-dev --optimize-autoloader
    php artisan config:cache
    php artisan route:cache
    php artisan view:cache

  deploy: |
    php artisan migrate --force

# Cron (planificateur)
cron:
  - spec: '*/15 * * * *'
    cmd: 'php artisan schedule:run'

# Disques
disk: 1024